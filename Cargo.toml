[package]
name = "rent-vs-buy-calculator"
version = "0.1.0"
edition = "2021"
authors = ["Luke Aslanian"]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
charming = { version = "0.4", features = ["wasm"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
# Note: rayon doesn't work in WASM, so we'll handle Monte Carlo differently
# rayon = "1.8"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib", "rlib"]
